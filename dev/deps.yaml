version: "0.5"

# Dependabot doesn't read this file. just images fails until its pins match
# the ones in dev/kind/.
processes:
  postgres:
    vars:
      image: docker.io/library/postgres:18.6-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
    command: >-
      $CONTAINER_RUNTIME rm --force phemera-postgres >/dev/null 2>&1;
      exec $CONTAINER_RUNTIME run --rm --name phemera-postgres
      --publish 127.0.0.1:5432:5432
      --env POSTGRES_USER=phemera
      --env POSTGRES_PASSWORD=phemera
      --volume phemera-postgres:/var/lib/postgresql
      {{.image}}
    readiness_probe:
      exec:
        command: $CONTAINER_RUNTIME exec phemera-postgres pg_isready --username phemera --host 127.0.0.1
      initial_delay_seconds: 2
      period_seconds: 2
      # process-compose stops Postgres after this many failed checks, and
      # the first start has to pull the image.
      failure_threshold: 60

  ssh-host:
    vars:
      image: lscr.io/linuxserver/openssh-server:latest@sha256:c8431b8982e7eb3935ebf9c46607d19c6417e39c12ce884cc66945df2e9334e8
    command: >-
      $CONTAINER_RUNTIME rm --force phemera-ssh-host >/dev/null 2>&1;
      exec $CONTAINER_RUNTIME run --rm --name phemera-ssh-host
      --publish 127.0.0.1:2222:2222
      --env USER_NAME=phemera
      --env USER_PASSWORD=phemera
      --env PASSWORD_ACCESS=true
      --volume ./dev/ssh-host:/config/ssh_host_keys:ro,z
      {{.image}}
    readiness_probe:
      exec:
        command: $CONTAINER_RUNTIME exec phemera-ssh-host nc -z localhost 2222
      initial_delay_seconds: 2
      period_seconds: 2
      failure_threshold: 60
