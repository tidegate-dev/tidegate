# just kind creates the Secret dev-ca from dev/tls/.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: dev-ca
spec:
  ca:
    secretName: dev-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: authority-external-api
spec:
  secretName: authority-external-api-tls
  issuerRef:
    name: dev-ca
    kind: Issuer
  privateKey:
    algorithm: ECDSA
    size: 256
  dnsNames:
    - localhost
  ipAddresses:
    - 127.0.0.1
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: authority-internal-api
spec:
  secretName: authority-internal-api-tls
  issuerRef:
    name: dev-ca
    kind: Issuer
  privateKey:
    algorithm: ECDSA
    size: 256
  dnsNames:
    - localhost
  ipAddresses:
    - 127.0.0.1
