apiVersion: apps/v1
kind: Deployment
metadata:
  name: authority
  labels:
    app.kubernetes.io/part-of: phemera
spec:
  selector:
    matchLabels:
      app: authority
  template:
    metadata:
      labels:
        app: authority
    spec:
      # 65532 is the user ID of the distroless image.
      securityContext:
        fsGroup: 65532
      containers:
        - name: authority
          image: localhost/phemera-authority:latest
          # just kind loads the image into the cluster, there's no registry.
          imagePullPolicy: Never
          env:
            - name: PHEMERA_AUTHORITY__LOG__FORMAT
              value: text
            - name: PHEMERA_AUTHORITY__DATABASE__URL
              value: postgres://phemera:phemera@postgres:5432/phemera?sslmode=disable
            - name: PHEMERA_AUTHORITY__DATABASE__MIGRATE_ON_START
              value: "true"
          volumeMounts:
            - name: external-api-tls
              mountPath: /etc/phemera/authority/external-api-tls
              readOnly: true
            - name: internal-api-tls
              mountPath: /etc/phemera/authority/internal-api-tls
              readOnly: true
          ports:
            - name: http
              containerPort: 8080
      volumes:
        - name: external-api-tls
          secret:
            secretName: authority-external-api-tls
            defaultMode: 0440
        - name: internal-api-tls
          secret:
            secretName: authority-internal-api-tls
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: authority
spec:
  type: NodePort
  selector:
    app: authority
  ports:
    - port: 8080
      targetPort: http
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssh-proxy
  labels:
    app.kubernetes.io/part-of: phemera
spec:
  selector:
    matchLabels:
      app: ssh-proxy
  template:
    metadata:
      labels:
        app: ssh-proxy
    spec:
      containers:
        - name: ssh-proxy
          image: localhost/phemera-ssh-proxy:latest
          imagePullPolicy: Never
          env:
            - name: PHEMERA_SSH_PROXY__LOG__FORMAT
              value: text
          ports:
            - name: ssh
              containerPort: 2022
        # The ssh-proxy prototype connects every session to 127.0.0.1:2222.
        - name: ssh-host
          image: lscr.io/linuxserver/openssh-server:latest@sha256:b07414bb329b86a00525c9256711a7855fc3a369e9f62c36f1de8d1923197580
          env:
            - name: USER_NAME
              value: phemera
            - name: USER_PASSWORD
              value: phemera
            - name: PASSWORD_ACCESS
              value: "true"
          ports:
            - name: ssh-host
              containerPort: 2222
          readinessProbe:
            tcpSocket:
              port: ssh-host
          volumeMounts:
            - name: ssh-host-keys
              mountPath: /config/ssh_host_keys
              readOnly: true
      volumes:
        # just kind creates the Secret ssh-host-keys from dev/ssh-host/.
        - name: ssh-host-keys
          secret:
            secretName: ssh-host-keys
---
apiVersion: v1
kind: Service
metadata:
  name: ssh-proxy
spec:
  type: NodePort
  selector:
    app: ssh-proxy
  ports:
    - port: 2022
      targetPort: ssh
      nodePort: 30022
