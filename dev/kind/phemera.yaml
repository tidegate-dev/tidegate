apiVersion: apps/v1
kind: Deployment
metadata:
  name: authority
  labels:
    app.kubernetes.io/part-of: phemera
spec:
  selector:
    matchLabels:
      app: authority
  template:
    metadata:
      labels:
        app: authority
    spec:
      # 65532 is the user ID of the distroless image.
      securityContext:
        fsGroup: 65532
      containers:
        - name: authority
          image: localhost/phemera-authority:latest
          # just kind loads the image into the cluster, there's no registry.
          imagePullPolicy: Never
          env:
            - name: PHEMERA_AUTHORITY__LOG__FORMAT
              value: text
            - name: PHEMERA_AUTHORITY__DATABASE__URL
              value: postgres://phemera:phemera@postgres:5432/phemera?sslmode=disable
            - name: PHEMERA_AUTHORITY__DATABASE__MIGRATE_ON_START
              value: "true"
          volumeMounts:
            - name: external-api-tls
              mountPath: /etc/phemera/authority/external-api-tls
              readOnly: true
            - name: internal-api-tls
              mountPath: /etc/phemera/authority/internal-api-tls
              readOnly: true
          ports:
            - name: http
              containerPort: 8080
      volumes:
        - name: external-api-tls
          secret:
            secretName: authority-external-api-tls
            defaultMode: 0440
        - name: internal-api-tls
          secret:
            secretName: authority-internal-api-tls
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: authority
spec:
  type: NodePort
  selector:
    app: authority
  ports:
    - port: 8080
      targetPort: http
      nodePort: 30080
