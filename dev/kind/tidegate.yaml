apiVersion: apps/v1
kind: Deployment
metadata:
  name: authority
  labels:
    app.kubernetes.io/part-of: tidegate
spec:
  selector:
    matchLabels:
      app: authority
  template:
    metadata:
      labels:
        app: authority
    spec:
      containers:
        - name: authority
          image: localhost/tidegate-authority:latest
          # just kind loads the image into the cluster, there's no registry.
          imagePullPolicy: Never
          env:
            - name: TIDEGATE_AUTHORITY__LOG__FORMAT
              value: text
            - name: TIDEGATE_AUTHORITY__SERVER__TLS__CERT_FILE
              value: /tls/tls.crt
            - name: TIDEGATE_AUTHORITY__SERVER__TLS__KEY_FILE
              value: /tls/tls.key
            - name: TIDEGATE_AUTHORITY__DATABASE__URL
              value: postgres://tidegate:tidegate@postgres:5432/tidegate
            - name: TIDEGATE_AUTHORITY__DATABASE__MIGRATE_ON_START
              value: "true"
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
          ports:
            - name: http
              containerPort: 8080
      volumes:
        - name: tls
          secret:
            secretName: authority-tls
---
apiVersion: v1
kind: Service
metadata:
  name: authority
spec:
  type: NodePort
  selector:
    app: authority
  ports:
    - port: 8080
      targetPort: http
      nodePort: 30080
