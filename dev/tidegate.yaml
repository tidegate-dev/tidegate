version: "0.5"

processes:
  authority:
    command: go build -o bin/authority ./authority/cmd/authority && exec bin/authority
    environment:
      - TIDEGATE_AUTHORITY__LOG__FORMAT=text
      - TIDEGATE_AUTHORITY__EXTERNAL_API__TLS__CERT_FILE=dev/tls/authority-external-api.pem
      - TIDEGATE_AUTHORITY__EXTERNAL_API__TLS__KEY_FILE=dev/tls/authority-external-api-key.pem
      - TIDEGATE_AUTHORITY__INTERNAL_API__TLS__CERT_FILE=dev/tls/authority-internal-api.pem
      - TIDEGATE_AUTHORITY__INTERNAL_API__TLS__KEY_FILE=dev/tls/authority-internal-api-key.pem
      - TIDEGATE_AUTHORITY__DATABASE__URL=postgres://tidegate:tidegate@127.0.0.1:5432/tidegate?sslmode=disable
      - TIDEGATE_AUTHORITY__DATABASE__MIGRATE_ON_START=true
    depends_on:
      postgres:
        condition: process_healthy
