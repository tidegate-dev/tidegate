version: "0.5"

processes:
  authority:
    command: go build -o bin/authority ./authority/cmd/authority && exec bin/authority
    environment:
      - TIDEGATE_AUTHORITY__LOG__FORMAT=text
      - TIDEGATE_AUTHORITY__SERVER__TLS__CERT_FILE=dev/tls/authority.pem
      - TIDEGATE_AUTHORITY__SERVER__TLS__KEY_FILE=dev/tls/authority-key.pem
