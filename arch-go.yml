# Which packages may import which, checked by `just arch`. arch-go turns each
# pattern into a regular expression and matches it anywhere in the import
# path, so every pattern starts at the module path. `x.**` covers x and
# everything below it. arch-go reads packages like `go build` does on the
# current system, so it doesn't see test files or files behind a build tag.
version: 1
threshold:
  compliance: 100
  coverage: 100
dependenciesRules:
  # internal/ imports nothing from a component or from gen/.
  - package: '^github.com/phemera-dev/phemera/internal.**'
    shouldOnlyDependsOn:
      internal:
        - '^github.com/phemera-dev/phemera/internal.**'

  # gen/ imports only gen/.
  - package: '^github.com/phemera-dev/phemera/gen.**'
    shouldOnlyDependsOn:
      internal:
        - '^github.com/phemera-dev/phemera/gen.**'

  # A component imports only itself, internal/ and gen/, nothing from another
  # component.
  - package: '^github.com/phemera-dev/phemera/authority.**'
    shouldOnlyDependsOn:
      internal:
        - '^github.com/phemera-dev/phemera/authority.**'
        - '^github.com/phemera-dev/phemera/internal.**'
        - '^github.com/phemera-dev/phemera/gen.**'

  - package: '^github.com/phemera-dev/phemera/cli.**'
    shouldOnlyDependsOn:
      internal:
        - '^github.com/phemera-dev/phemera/cli.**'
        - '^github.com/phemera-dev/phemera/internal.**'
        - '^github.com/phemera-dev/phemera/gen.**'

  - package: '^github.com/phemera-dev/phemera/ssh-proxy.**'
    shouldOnlyDependsOn:
      internal:
        - '^github.com/phemera-dev/phemera/ssh-proxy.**'
        - '^github.com/phemera-dev/phemera/internal.**'
        - '^github.com/phemera-dev/phemera/gen.**'

  # The authority's layers: api calls service, service uses model, and store
  # implements the storage interfaces from model.
  - package: '^github.com/phemera-dev/phemera/authority/internal/password$'
    shouldOnlyDependsOn:
      internal:
        - '^github.com/phemera-dev/phemera/internal/secret$'

  - package: '^github.com/phemera-dev/phemera/authority/internal/sshkey$'
    shouldOnlyDependsOn:
      internal:
        - '^github.com/phemera-dev/phemera/internal/secret$'

  # config checks the database URL with the parser that db uses.
  - package: '^github.com/phemera-dev/phemera/authority/internal/config$'
    shouldOnlyDependsOn:
      internal:
        - '^github.com/phemera-dev/phemera/internal.**'
        - '^github.com/phemera-dev/phemera/authority/internal/db/dburl$'

  - package: '^github.com/phemera-dev/phemera/authority/internal/db.**'
    shouldOnlyDependsOn:
      internal:
        - '^github.com/phemera-dev/phemera/authority/internal/db.**'

  # The Postgres secret engine imports nothing from the authority.
  - package: '^github.com/phemera-dev/phemera/authority/internal/secretengine/postgres$'
    shouldOnlyDependsOn:
      internal:
        - '^github.com/phemera-dev/phemera/internal/secretengine$'
        - '^github.com/phemera-dev/phemera/internal/secret$'

  # Only server imports the Postgres secret engine.
  - package: '^github.com/phemera-dev/phemera/authority/cmd/authority$'
    shouldNotDependsOn:
      internal:
        - '^github.com/phemera-dev/phemera/authority/internal/secretengine/postgres$'

  - package: '^github.com/phemera-dev/phemera/authority/internal/command$'
    shouldNotDependsOn:
      internal:
        - '^github.com/phemera-dev/phemera/authority/internal/secretengine/postgres$'

  - package: '^github.com/phemera-dev/phemera/authority/internal/model$'
    shouldOnlyDependsOn:
      internal:
        - '^github.com/phemera-dev/phemera/internal/secret$'
    shouldNotDependsOn:
      external:
        - github.com/jackc/pgx/v5.**

  - package: '^github.com/phemera-dev/phemera/authority/internal/store$'
    shouldOnlyDependsOn:
      internal:
        - '^github.com/phemera-dev/phemera/authority/internal/db/sqlc$'
        - '^github.com/phemera-dev/phemera/authority/internal/model$'
        - '^github.com/phemera-dev/phemera/internal/secret$'

  - package: '^github.com/phemera-dev/phemera/authority/internal/service$'
    shouldOnlyDependsOn:
      internal:
        - '^github.com/phemera-dev/phemera/authority/internal/model$'
        - '^github.com/phemera-dev/phemera/authority/internal/password$'
        - '^github.com/phemera-dev/phemera/authority/internal/sshkey$'
        - '^github.com/phemera-dev/phemera/internal/secret$'
        - '^github.com/phemera-dev/phemera/internal/secretengine$'
    shouldNotDependsOn:
      external:
        - connectrpc.com/connect
        - github.com/jackc/pgx/v5.**

  - package: '^github.com/phemera-dev/phemera/authority/internal/api$'
    shouldOnlyDependsOn:
      internal:
        - '^github.com/phemera-dev/phemera/authority/internal/service$'
        - '^github.com/phemera-dev/phemera/authority/internal/model$'
        - '^github.com/phemera-dev/phemera/authority/internal/password$'
        - '^github.com/phemera-dev/phemera/authority/internal/sshkey$'
        - '^github.com/phemera-dev/phemera/gen.**'
        - '^github.com/phemera-dev/phemera/internal/logging$'
        - '^github.com/phemera-dev/phemera/internal/secret$'
    shouldNotDependsOn:
      external:
        - github.com/jackc/pgx/v5.**
