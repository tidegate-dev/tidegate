name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  sign-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check that every commit is signed off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          failed=0
          for commit in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            email=$(git show -s --format=%ae "$commit")
            if ! git show -s --format=%B "$commit" | grep '^Signed-off-by: ' | grep -qF "<$email>"; then
              echo "::error::Commit $commit has no Signed-off-by line for its author <$email>."
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "See CONTRIBUTING.md for how to sign off your commits."
            exit 1
          fi
          echo "All commits are signed off."
