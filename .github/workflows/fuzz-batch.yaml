name: Fuzz on a schedule

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  fuzz:
    runs-on: ubuntu-latest
    # The job reads artifacts that pull request runs can upload too, so it must
    # never get a secret or a write permission.
    permissions:
      contents: read
      actions: read # Reads the corpus from the last run.
    steps:
      - name: Build the fuzz tests
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: go
      - name: Fuzz every fuzz test
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          mode: batch
          fuzz-seconds: 3600
