name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Uploads the coverage to Codecov without a stored token.
      id-token: write
    services:
      postgres:
        # Dependabot doesn't read this file. just images fails until this pin
        # matches the one in dev/kind/.
        image: docker.io/library/postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        env:
          POSTGRES_USER: tidegate
          POSTGRES_PASSWORD: tidegate
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready --username tidegate --host 127.0.0.1"
          --health-interval 2s
          --health-retries 30
    env:
      TIDEGATE_TEST_DATABASE_URL: postgres://tidegate:tidegate@127.0.0.1:5432/tidegate?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # just secrets checks every commit, not only the last one.
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Run every check
        run: nix develop --command just ci
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          # The test recipes in just ci write these.
          files: coverage/authority.out,coverage/authority-integration.out,coverage/authority-api.out,coverage/authority-e2e.out,coverage/cli.out,coverage/internal.out
          disable_search: true
          # Pull requests from forks get no OIDC token, and Codecov accepts
          # their uploads without one.
          use_oidc: ${{ !github.event.pull_request.head.repo.fork }}
      - name: List the changes no test catches
        if: github.event_name == 'pull_request'
        env:
          # A branch name can contain shell code.
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -o pipefail
          {
            echo '## Changes no test catches'
            echo
            echo '```'
            nix develop --command just mutate "origin/$BASE_REF"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
