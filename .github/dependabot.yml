version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    # delay routine depedency bumps by 7 days to allow new releases to stabilize
    # security updates are not delayed
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      patch:
        update-types:
          - patch
      minor:
        update-types:
          - minor

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      patch:
        update-types:
          - patch
      minor:
        update-types:
          - minor

  - package-ecosystem: docker
    directories:
      - /.clusterfuzzlite
      - /authority
      - /dev
      - /dev/kind
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    # just kind builds these images locally, they aren't in a registry.
    ignore:
      - dependency-name: "*tidegate-*"
    groups:
      patch:
        update-types:
          - patch
      minor:
        update-types:
          - minor

  - package-ecosystem: helm
    directory: /dev/kind/cert-manager
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      patch:
        update-types:
          - patch
      minor:
        update-types:
          - minor

  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
