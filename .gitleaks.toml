[extend]
useDefault = true

# The default rules don't cover connection strings, like
# postgres://user:password@host/db.
[[rules]]
id = "connection-string-password"
description = "Connection string with a password"
regex = '''(?i)\b[a-z][a-z0-9+.-]*://[^:/\s@]+:([^@/\s]+)@'''
secretGroup = 1
keywords = ["://"]

# The local development environment uses this password.
[[rules.allowlists]]
regexes = ['''^tidegate$''']

[[allowlists]]
description = "Throwaway host key of the local test SSH host"
paths = ['''^dev/ssh-host/ssh_host_ed25519_key$''']
