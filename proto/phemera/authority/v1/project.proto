syntax = "proto3";

package phemera.authority.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/phemera-dev/phemera/gen/phemera/authority/v1;authorityv1";

// ProjectService creates and lists projects. A project holds assets, roles and
// bindings.
service ProjectService {
  // CreateProject creates a project and returns it. A name that another
  // project has fails with already_exists.
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);
  // ListProjects returns every project.
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
}

// CreateProjectRequest is the input of ProjectService.CreateProject.
message CreateProjectRequest {
  // Name is the name of the new project.
  //
  // Rules: Starts with a lowercase letter, goes on with lowercase letters,
  // digits and dashes, and ends with a letter or digit. At most 63 characters.
  string name = 1 [(buf.validate.field).cel = {
    id: "project.name"
    message: "must start with a lowercase letter, go on with lowercase letters, digits and dashes, end with a letter or digit, and have at most 63 characters"
    expression: "this.matches('^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$')"
  }];
}

// CreateProjectResponse is the result of ProjectService.CreateProject.
message CreateProjectResponse {
  // ID identifies the new project. It is a UUID.
  string id = 1;
  // Name is the new project's name.
  string name = 2;
}

// ListProjectsRequest is the input of ProjectService.ListProjects.
message ListProjectsRequest {}

// ListProjectsResponse is the result of ProjectService.ListProjects.
message ListProjectsResponse {
  // Project is one project in the list.
  message Project {
    // ID identifies the project. It is a UUID.
    string id = 1;
    // Name is the project's name.
    string name = 2;
  }

  // Projects are all projects.
  repeated Project projects = 1;
}
