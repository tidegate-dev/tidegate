syntax = "proto3";

package tidegate.authority.v1;

option go_package = "github.com/tidegate-dev/tidegate/gen/tidegate/authority/v1;authorityv1";

// PingService checks that a client can reach the authority.
service PingService {
  // Ping answers with pong.
  rpc Ping(PingRequest) returns (PingResponse);
}

message PingRequest {}

message PingResponse {
  // Message is always "pong".
  string message = 1;
}
