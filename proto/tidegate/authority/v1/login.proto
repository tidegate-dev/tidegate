syntax = "proto3";

package tidegate.authority.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/tidegate-dev/tidegate/gen/tidegate/authority/v1;authorityv1";

// LoginService signs users in to the authority.
service LoginService {
  // Login checks a user's local password and returns a login token. All
  // wrong credentials get the same error.
  rpc Login(LoginRequest) returns (LoginResponse);
  // Logout revokes the login token in the call's `Authorization: Bearer`
  // header, so later calls with it fail. A missing, unknown or expired token
  // fails with unauthenticated.
  rpc Logout(LogoutRequest) returns (LogoutResponse);
}

// LoginRequest is the input of LoginService.Login.
message LoginRequest {
  // UserName is the user's name, in any letter case.
  //
  // Rules: Not empty.
  string user_name = 1 [(buf.validate.field).string.min_len = 1];
  // Password is the user's local password.
  //
  // Rules: Not empty, at most 1024 bytes.
  string password = 2 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 1024
  }];
}

// LoginResponse is the result of LoginService.Login.
message LoginResponse {
  // Token is valid for the authority's token lifetime, 12 hours by default.
  string token = 1;
}

// LogoutRequest is the input of LoginService.Logout.
message LogoutRequest {
  // AllSessions revokes every login token of the caller's user, not only the
  // one the call carries.
  bool all_sessions = 1;
}

// LogoutResponse is the result of LoginService.Logout.
message LogoutResponse {}
