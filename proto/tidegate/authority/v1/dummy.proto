syntax = "proto3";

package tidegate.authority.v1;

option go_package = "github.com/tidegate-dev/tidegate/gen/tidegate/authority/v1;authorityv1";

// DummyService stores and reads texts, to check the path from a client through
// the authority into the database and back.
service DummyService {
  // Write stores a text and returns its ID.
  rpc Write(WriteRequest) returns (WriteResponse);
  // Read returns the text with the given ID.
  rpc Read(ReadRequest) returns (ReadResponse);
}

// WriteRequest is the input of DummyService.Write.
message WriteRequest {
  // Text is the text to store.
  string text = 1;
}

// WriteResponse is the result of DummyService.Write.
message WriteResponse {
  // ID identifies the stored text for DummyService.Read.
  int64 id = 1;
}

// ReadRequest is the input of DummyService.Read.
message ReadRequest {
  // ID is the one DummyService.Write returned for the text.
  int64 id = 1;
}

// ReadResponse is the result of DummyService.Read.
message ReadResponse {
  // Text is the stored text.
  string text = 1;
}
