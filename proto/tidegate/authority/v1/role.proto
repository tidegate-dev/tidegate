syntax = "proto3";

package tidegate.authority.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/tidegate-dev/tidegate/gen/tidegate/authority/v1;authorityv1";

// RoleService creates roles. A role is a named list of permissions in one
// project.
service RoleService {
  // CreateRole creates a role in a project and returns it. A project that
  // doesn't exist fails with not_found. A name that another role of the
  // project has fails with already_exists.
  rpc CreateRole(CreateRoleRequest) returns (CreateRoleResponse);
}

// ProjectPermissions says what the holders of a role may do with the roles
// and bindings of its project.
message ProjectPermissions {
  // CreateRoles means the holders may create roles in the project.
  bool create_roles = 1;
  // Escalate means the holders may create roles with permissions that they
  // don't have themselves.
  bool escalate = 2;
  // CreateBindings means the holders may create bindings in the project.
  bool create_bindings = 3;
  // Bind means the holders may bind roles with permissions that they don't
  // have themselves.
  bool bind = 4;
}

// CreateRoleRequest is the input of RoleService.CreateRole.
message CreateRoleRequest {
  // ProjectName is the name of the project that gets the role.
  //
  // Rules: Starts with a lowercase letter, goes on with lowercase letters,
  // digits and dashes, and ends with a letter or digit. At most 63 characters.
  string project_name = 1 [(buf.validate.field).cel = {
    id: "role.project_name"
    message: "must start with a lowercase letter, go on with lowercase letters, digits and dashes, end with a letter or digit, and have at most 63 characters"
    expression: "this.matches('^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$')"
  }];
  // Name is the name of the new role.
  //
  // Rules: Starts with a lowercase letter, goes on with lowercase letters,
  // digits and dashes, and ends with a letter or digit. At most 63 characters.
  string name = 2 [(buf.validate.field).cel = {
    id: "role.name"
    message: "must start with a lowercase letter, go on with lowercase letters, digits and dashes, end with a letter or digit, and have at most 63 characters"
    expression: "this.matches('^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$')"
  }];
  // Permissions are the permissions of the new role. A role without them
  // gives its holders nothing.
  ProjectPermissions permissions = 3;
}

// CreateRoleResponse is the result of RoleService.CreateRole.
message CreateRoleResponse {
  // ID identifies the new role. It is a UUID.
  string id = 1;
  // ProjectID identifies the project that the new role belongs to. It is a
  // UUID.
  string project_id = 2;
  // Name is the new role's name.
  string name = 3;
  // Permissions say what the users who have the new role may do.
  ProjectPermissions permissions = 4;
}
